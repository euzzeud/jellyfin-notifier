<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="view-transition" content="same-origin" />
<title>Login - Jellyfin Notifier</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('admin.assets', filename='favicon.svg') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <img src="{{ url_for('admin.assets', filename='jellyfin-notifier-wordmark.svg') }}" alt="Jellyfin Notifier" />
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    <input type="hidden" name="next" value="{{ next }}" />
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />
    <button type="submit">Login</button>
  </form>
</div>
<footer class="app-footer">&copy; {{ current_year() }} Enzo GIOIELLI</footer>
</body>
</html>
