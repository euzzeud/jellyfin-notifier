<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}Jellyfin Notifier - Admin{% endblock %}</title>
<style>
  :root {
    --bg:#0b0b0d; --bg-glow: radial-gradient(1100px 520px at 12% -10%, rgba(0,164,220,.14), transparent 60%),
                              radial-gradient(900px 480px at 100% 0%, rgba(170,92,195,.12), transparent 55%);
    --panel: rgba(255,255,255,.045); --panel-solid:#17171a; --panel2: rgba(255,255,255,.03);
    --border: rgba(255,255,255,.09); --border-soft: rgba(255,255,255,.06);
    --purple:#b476d1; --purple2:#8e4fb0; --blue:#12b3f0; --blue2:#0092c7;
    --text:#f4f4f6; --muted:#93939c; --muted-dim:#6b6b74;
    --green:#3ecf6e; --red:#f0555c;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -14px rgba(0,0,0,.55);
    --shadow-pop: 0 14px 34px -12px rgba(0,0,0,.6);
    --ease: cubic-bezier(.16,.84,.44,1);
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(18,179,240,.35); color:#fff; }
  html { scroll-behavior: smooth; }
  body {
    margin:0; min-height:100vh; background: var(--bg-glow), var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; animation: pagein .35s var(--ease);
  }
  @keyframes pagein { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }

  header {
    background: rgba(12,12,14,.72); backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom:1px solid var(--border-soft); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index:20;
  }
  header .brand { font-weight:700; font-size:19px; letter-spacing:.3px; display:flex; align-items:center; gap:12px; }
  header .brand span { color:var(--muted); font-weight:500; font-size:12.5px; }
  header .right { display:flex; align-items:center; gap:16px; }
  .logout-form button {
    background:none; box-shadow:none; border:1px solid var(--border); color:var(--muted);
    padding:6px 14px; font-size:12px; font-weight:600;
  }
  .logout-form button:hover { color:var(--text); background: rgba(255,255,255,.06); transform:none; filter:none; }

  nav {
    display:flex; gap:2px; padding:8px 24px; background: rgba(255,255,255,.02);
    border-bottom:1px solid var(--border-soft); flex-wrap:wrap;
    position: sticky; top:56px; z-index:19; backdrop-filter: blur(10px);
  }
  nav a {
    color:var(--muted); text-decoration:none; font-size:13px; font-weight:500; padding:8px 14px;
    border-radius:999px; transition: color .18s var(--ease), background-color .18s var(--ease), transform .18s var(--ease);
    position: relative;
  }
  nav a:hover { background: rgba(255,255,255,.06); color:var(--text); }
  nav a:active { transform: scale(.97); }
  nav a.active {
    background: linear-gradient(135deg, var(--blue2), var(--purple2)); color:#fff;
    box-shadow: 0 4px 14px -4px rgba(18,179,240,.5);
  }

  main { max-width:920px; margin:0 auto; padding:28px 24px 60px; }
  main.wide { max-width:1360px; }
  .split { display:grid; grid-template-columns: minmax(340px, 1fr) minmax(340px, 1fr); gap:20px; align-items:start; }
  .split .preview-col { position: sticky; top:104px; }
  @media (max-width: 980px) { .split { grid-template-columns: 1fr; } .split .preview-col { position:static; } }
  .preview-frame-wrap { border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; background:#0b0b0c; box-shadow: var(--shadow-card); }
  .preview-frame-wrap iframe { width:100%; height:640px; border:0; display:block; background:#101010; }
  .color-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .color-field { display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border-soft); border-radius:999px; padding:6px 12px 6px 6px; }
  .color-field input[type=color] { width:28px; height:28px; padding:0; border:none; border-radius:50%; overflow:hidden; cursor:pointer; background:none; }
  .color-field span { font-size:12px; color:var(--muted); font-weight:500; }

  .card {
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:22px 24px; margin-bottom:18px; box-shadow: var(--shadow-card);
    backdrop-filter: blur(6px); transition: border-color .2s var(--ease), transform .2s var(--ease);
    animation: cardin .4s var(--ease) backwards;
  }
  .card:hover { border-color: rgba(255,255,255,.15); }
  @keyframes cardin { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .card h2 {
    margin-top:0; margin-bottom:16px; font-size:12.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1px; font-weight:700; display:flex; align-items:center; gap:8px;
  }

  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap:12px; }
  .stat {
    background: var(--panel2); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:14px 16px; transition: background-color .2s var(--ease), transform .2s var(--ease);
  }
  .stat:hover { background: rgba(255,255,255,.05); transform: translateY(-1px); }
  .stat .label { color:var(--muted-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .stat .value { font-size:19px; font-weight:700; margin-top:6px; letter-spacing:-.2px; }

  .pill {
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
  .pill.ok { background:rgba(62,207,110,.13); color:var(--green); box-shadow: inset 0 0 0 1px rgba(62,207,110,.2); }
  .pill.bad { background:rgba(240,85,92,.13); color:var(--red); box-shadow: inset 0 0 0 1px rgba(240,85,92,.2); }

  label { display:block; font-size:12px; color:var(--muted); margin: 16px 0 7px; font-weight:500; }
  input[type=text], input[type=password], input[type=number], input[type=time], select, textarea {
    width:100%; background: rgba(0,0,0,.22); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius: var(--radius-sm); font-size:13.5px; font-family: inherit;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
  }
  input:hover, select:hover, textarea:hover { border-color: rgba(255,255,255,.22); }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color: var(--blue); background: rgba(18,179,240,.06);
    box-shadow: 0 0 0 3px rgba(18,179,240,.16);
  }
  textarea { font-family: "SF Mono", Consolas, "Cascadia Code", monospace; font-size:12.5px; line-height:1.55; }

  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .checkboxes { display:flex; gap:8px; flex-wrap:wrap; }
  .checkboxes label {
    display:flex; align-items:center; gap:7px; background: var(--panel2); border:1px solid var(--border-soft);
    padding:8px 13px; border-radius:999px; margin:0; color:var(--text); font-size:12.5px; font-weight:500;
    cursor:pointer; transition: background-color .18s var(--ease), border-color .18s var(--ease);
  }
  .checkboxes label:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); }
  .checkboxes input { width:auto; accent-color: var(--blue); }

  .tag-input {
    position: relative; display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    background: rgba(0,0,0,.22); border:1px solid var(--border); border-radius: var(--radius-sm);
    padding:7px 9px; min-height:42px; cursor:text;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
  }
  .tag-input:hover { border-color: rgba(255,255,255,.22); }
  .tag-input:focus-within { border-color: var(--blue); background: rgba(18,179,240,.06); box-shadow: 0 0 0 3px rgba(18,179,240,.16); }
  .tag-input-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .tag-chip {
    display:inline-flex; align-items:center; gap:6px; background: linear-gradient(135deg, var(--blue2), var(--purple2));
    color:#fff; padding:4px 4px 4px 11px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .tag-chip button {
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; background: rgba(255,255,255,.22); font-size:10px; line-height:1;
    transition: background-color .15s var(--ease);
  }
  .tag-chip button:hover { background: rgba(255,255,255,.4); }
  .tag-input-text {
    flex:1; min-width:140px; background:none !important; border:none !important; padding:4px 2px !important;
    box-shadow:none !important; color:var(--text); font-size:13.5px;
  }
  .tag-input-text:focus { outline:none; box-shadow:none !important; background:none !important; }
  .tag-input-suggestions {
    position:absolute; top:calc(100% + 6px); left:0; right:0; background: var(--panel-solid); border:1px solid var(--border);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-pop); max-height:220px; overflow:auto; z-index:30;
    display:none; animation: alertin .15s var(--ease);
  }
  .tag-input-suggestions.open { display:block; }
  .tag-input-suggestion { padding:9px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .tag-input-suggestion:hover, .tag-input-suggestion.active { background: rgba(255,255,255,.08); }
  .tag-input.tag-input-invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(240,85,92,.16); animation: taginshake .3s var(--ease); }
  @keyframes taginshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tag-input-error-msg { display:none; color:var(--red); font-size:11.5px; margin-top:2px; flex-basis:100%; }
  .tag-input-error-msg.show { display:block; }
  .tag-chip.invalid { background: linear-gradient(135deg, #f0656c, #cf3b42); }

  button, .btn {
    background: linear-gradient(135deg, var(--blue), var(--blue2)); color:#fff; border:none;
    padding:10px 20px; border-radius: 999px; font-size:13px; font-weight:600; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    box-shadow: 0 6px 16px -6px rgba(18,179,240,.55);
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), filter .16s var(--ease);
  }
  button.secondary, .btn.secondary {
    background: rgba(255,255,255,.07); box-shadow:none; border:1px solid var(--border);
  }
  button.danger, .btn.danger { background: linear-gradient(135deg, #f0656c, #cf3b42); box-shadow: 0 6px 16px -6px rgba(240,85,92,.5); }
  button:hover, .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:active, .btn:active { transform: translateY(0) scale(.98); }
  button.secondary:hover, .btn.secondary:hover { background: rgba(255,255,255,.11); }

  .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  .alert {
    padding:11px 15px; border-radius: var(--radius-sm); font-size:13px; margin-bottom:16px;
    animation: alertin .25s var(--ease); font-weight:500;
  }
  @keyframes alertin { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }
  .alert.ok { background:rgba(62,207,110,.1); color:var(--green); border:1px solid rgba(62,207,110,.28); }
  .alert.err { background:rgba(240,85,92,.1); color:var(--red); border:1px solid rgba(240,85,92,.28); }

  pre.logbox {
    background: rgba(0,0,0,.3); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:16px; font-size:12px; line-height:1.6; overflow:auto; max-height:480px;
    white-space:pre-wrap; word-break:break-all; font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
  }
  pre.logbox::-webkit-scrollbar, main::-webkit-scrollbar { width:9px; height:9px; }
  pre.logbox::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius:99px; }
  pre.logbox::-webkit-scrollbar-track { background: transparent; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--muted-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  tbody tr { transition: background-color .15s var(--ease); }
  tbody tr:hover { background: rgba(255,255,255,.03); }

  .muted { color:var(--muted); }
  small.hint { color:var(--muted-dim); display:block; margin-top:6px; font-size:11.5px; }

  .toast-container {
    position: fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column;
    gap:10px; pointer-events:none; max-width: 340px;
  }
  .toast {
    pointer-events:auto; padding:12px 16px; border-radius: var(--radius-md); font-size:13px; font-weight:500;
    box-shadow: var(--shadow-pop); backdrop-filter: blur(8px);
    animation: toastin .3s var(--ease);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .toast.ok { background: rgba(23,45,32,.92); color:var(--green); border:1px solid rgba(62,207,110,.35); }
  .toast.err { background: rgba(48,20,21,.92); color:var(--red); border:1px solid rgba(240,85,92,.35); }
  .toast.out { opacity:0; transform: translateX(12px); }
  @keyframes toastin { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform:none; } }
  .flash-toast { display:none; }
</style>
</head>
<body>
<div class="toast-container" id="toast-container"></div>
<header>
  <div class="brand"><img src="{{ url_for('admin.assets', filename='jellyfin-logo.svg') }}" alt="Jellyfin" style="display:block; height:30px; width:auto;" /><span>Notifier</span></div>
  <div class="right">
    <div class="muted" style="font-size:12px;">{{ config.jellyfin_url if config is defined else "" }}</div>
    <form class="logout-form" method="post" action="{{ url_for('admin.logout') }}">
      <button type="submit">Sign out</button>
    </form>
  </div>
</header>
<nav>
  <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active=='dashboard' else '' }}">Dashboard</a>
  <a href="{{ url_for('admin.template_view') }}" class="{{ 'active' if active=='template' else '' }}">New Content Notifications</a>
  <a href="{{ url_for('admin.upcoming_view') }}" class="{{ 'active' if active=='upcoming' else '' }}">Upcoming Content Notifications</a>
  <a href="{{ url_for('admin.schedule_view') }}" class="{{ 'active' if active=='schedule' else '' }}">Schedule</a>
  <a href="{{ url_for('admin.api_console_view') }}" class="{{ 'active' if active=='api_console' else '' }}">Jellyfin Connection</a>
  <a href="{{ url_for('admin.mail_server_view') }}" class="{{ 'active' if active=='mail_server' else '' }}">Mail Server</a>
  <a href="{{ url_for('admin.logs') }}" class="{{ 'active' if active=='logs' else '' }}">Logs</a>
</nav>
<main class="{{ 'wide' if wide_layout else '' }}">
  {% block content %}{% endblock %}
</main>
<script>
function showToast(message, ok) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (ok ? 'ok' : 'err');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 320);
  }, 3200);
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.flash-toast').forEach(el => {
    showToast(el.textContent.trim(), el.classList.contains('ok'));
  });
});

// Champ "tags" réutilisable : espace/entrée/virgule/point-virgule
// transforment le texte tapé en tag (avec une croix pour le retirer), et
// une liste de suggestions s'affiche (toutes si le champ est vide, filtrées
// sinon). `hiddenInput.value` reste une liste séparée par des virgules,
// donc le formulaire qui le contient n'a rien à changer côté serveur.
function createTagInput({ root, hiddenInput, suggestions = [], placeholder = 'Type to add...', validate = null, invalidMessage = 'Invalid value' }) {
  const chipsEl = document.createElement('div');
  chipsEl.className = 'tag-input-chips';
  const textEl = document.createElement('input');
  textEl.type = 'text';
  textEl.className = 'tag-input-text';
  textEl.autocomplete = 'off';
  textEl.spellcheck = false;
  textEl.placeholder = placeholder;
  const suggEl = document.createElement('div');
  suggEl.className = 'tag-input-suggestions';
  const errorEl = document.createElement('div');
  errorEl.className = 'tag-input-error-msg';
  errorEl.textContent = invalidMessage;

  root.innerHTML = '';
  root.appendChild(chipsEl);
  root.appendChild(textEl);
  root.appendChild(suggEl);
  root.appendChild(errorEl);

  let tags = (hiddenInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
  let errTimer = null;

  function showError() {
    root.classList.add('tag-input-invalid');
    errorEl.classList.add('show');
    clearTimeout(errTimer);
    errTimer = setTimeout(clearError, 2500);
  }

  function clearError() {
    root.classList.remove('tag-input-invalid');
    errorEl.classList.remove('show');
  }

  function sync() {
    hiddenInput.value = tags.join(',');
    hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    renderChips();
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    tags.forEach((tag, i) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip' + (validate && !validate(tag) ? ' invalid' : '');
      const label = document.createElement('span');
      label.textContent = tag;
      if (validate && !validate(tag)) { label.title = invalidMessage; }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Remove ' + tag);
      btn.textContent = '✕';
      btn.addEventListener('click', (e) => { e.stopPropagation(); tags.splice(i, 1); sync(); });
      chip.appendChild(label);
      chip.appendChild(btn);
      chipsEl.appendChild(chip);
    });
  }

  function addTag(raw) {
    const value = raw.trim();
    if (!value) { textEl.value = ''; renderSuggestions(); return; }
    if (validate && !validate(value)) {
      // Garde le texte tapé dans le champ pour que l'utilisateur puisse le
      // corriger, au lieu de le faire disparaître silencieusement.
      showError();
      return;
    }
    clearError();
    textEl.value = '';
    if (!tags.some(t => t.toLowerCase() === value.toLowerCase())) {
      tags.push(value);
      sync();
    }
    renderSuggestions();
  }

  function renderSuggestions() {
    const query = textEl.value.trim().toLowerCase();
    const available = suggestions.filter(s => !tags.some(t => t.toLowerCase() === s.toLowerCase()));
    const matches = query ? available.filter(s => s.toLowerCase().includes(query)) : available;
    suggEl.innerHTML = '';
    if (!matches.length) { suggEl.classList.remove('open'); return; }
    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'tag-input-suggestion';
      item.textContent = s;
      // mousedown (pas click) : se déclenche avant le blur du champ texte.
      item.addEventListener('mousedown', (e) => { e.preventDefault(); addTag(s); textEl.focus(); });
      suggEl.appendChild(item);
    });
    suggEl.classList.add('open');
  }

  textEl.addEventListener('input', () => { clearError(); renderSuggestions(); });
  textEl.addEventListener('focus', renderSuggestions);
  textEl.addEventListener('blur', () => setTimeout(() => suggEl.classList.remove('open'), 150));
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',' || e.key === ';' || e.key === ' ') {
      e.preventDefault();
      addTag(textEl.value);
    } else if (e.key === 'Backspace' && !textEl.value && tags.length) {
      tags.pop();
      sync();
    } else if (e.key === 'Escape') {
      suggEl.classList.remove('open');
    }
  });
  root.addEventListener('mousedown', (e) => {
    if (e.target === root || e.target === chipsEl) { textEl.focus(); }
  });

  renderChips();
  return { getTags: () => tags.slice() };
}
</script>
</body>
</html>
