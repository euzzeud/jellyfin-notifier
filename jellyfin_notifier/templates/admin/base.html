<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="view-transition" content="same-origin" />
<title>{% block title %}Jellyfin Notifier - Admin{% endblock %}</title>
<style>
  /* Transition native du navigateur entre deux pages (changement d'onglet,
     retour, etc) : un fondu-enchaîné au lieu du "saut" d'une navigation
     classique. Fonctionne dans Chrome/Edge récents ; ignoré sans erreur
     ailleurs (Firefox/Safari retombent simplement sur le comportement
     habituel, rien à gérer côté JS). */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: .22s;
    animation-timing-function: cubic-bezier(.16,.84,.44,1);
  }

  :root {
    --bg:#0b0b0d; --bg-glow: radial-gradient(1100px 520px at 12% -10%, rgba(0,164,220,.14), transparent 60%),
                              radial-gradient(900px 480px at 100% 0%, rgba(170,92,195,.12), transparent 55%);
    --panel: rgba(255,255,255,.045); --panel-solid:#17171a; --panel2: rgba(255,255,255,.03);
    --border: rgba(255,255,255,.14); --border-soft: rgba(255,255,255,.1);
    --purple:#c589e0; --purple2:#a166c4; --blue:#2ec2ff; --blue2:#0ba8dd;
    --text:#ffffff; --muted:#b4b4bd; --muted-dim:#8c8c96;
    --green:#3ecf6e; --red:#f0555c;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -14px rgba(0,0,0,.55);
    --shadow-pop: 0 14px 34px -12px rgba(0,0,0,.6);
    --ease: cubic-bezier(.16,.84,.44,1);
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(18,179,240,.35); color:#fff; }
  html { scroll-behavior: smooth; }
  body {
    margin:0; min-height:100vh; background: var(--bg-glow), var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Pas d'animation "pagein" sur body : elle ferait double emploi avec le
     fondu-enchaîné de @view-transition ci-dessus (les cartes gardent leur
     propre petite entrée via .card/cardin plus bas). */

  /* header + nav sont regroupés dans .topbar, seul élément "sticky" (top:0) -
     avant, chacun était sticky séparément avec un top codé en dur pour nav
     (top:56px) qui ne correspondait pas exactement à la hauteur réelle du
     header (qui varie avec la taille du logo/texte) : ça provoquait un
     petit chevauchement/saut visible pendant le défilement. Un seul wrapper
     sticky élimine ce calcul manuel et le rend impossible à désynchroniser. */
  .topbar { position: sticky; top:0; z-index:20; }
  header {
    background: rgba(12,12,14,.72); backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom:1px solid var(--border-soft); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header .brand { font-weight:700; font-size:19px; letter-spacing:.3px; display:flex; align-items:center; gap:12px; }
  /* Le texte "Notifier" doit avoir la même échelle que le logo Jellyfin à
     côté (comme sur la page de login) - une ancienne règle laissée par un
     header précédent (logo + sous-titre "Admin" en petit) le réduisait
     encore à 12.5px malgré tout, ce qui le rendait minuscule et grisé. */
  header .brand span { color:var(--text); font-weight:700; font-size:22px; letter-spacing:.2px; }
  header .right { display:flex; align-items:center; gap:16px; }
  .logout-form button {
    background:none; box-shadow:none; border:1px solid rgba(229,72,77,.45); color:#e5484d;
    padding:6px 14px; font-size:12px; font-weight:600;
  }
  .logout-form button:hover { color:#fff; background:#e5484d; border-color:#e5484d; transform:none; filter:none; }

  nav {
    display:flex; gap:2px; padding:8px 24px; background: rgba(255,255,255,.02);
    border-bottom:1px solid var(--border-soft); flex-wrap:wrap;
    backdrop-filter: blur(10px);
  }
  nav a {
    color:var(--muted); text-decoration:none; font-size:13px; font-weight:500; padding:8px 14px;
    border-radius:999px; transition: color .18s var(--ease), background-color .18s var(--ease), transform .18s var(--ease);
    position: relative;
  }
  nav a:hover { background: rgba(255,255,255,.06); color:var(--text); }
  nav a:active { transform: scale(.97); }
  nav a.active {
    background: linear-gradient(135deg, var(--blue2), var(--purple2)); color:#fff;
    box-shadow: 0 4px 14px -4px rgba(18,179,240,.5);
  }

  main { max-width:920px; margin:0 auto; padding:28px 24px 60px; }
  main.wide { max-width:1360px; }
  .split { display:grid; grid-template-columns: minmax(340px, 1fr) minmax(340px, 1fr); gap:20px; align-items:start; }
  .split .preview-col { position: sticky; top:112px; }
  @media (max-width: 980px) { .split { grid-template-columns: 1fr; } .split .preview-col { position:static; } }
  .preview-frame-wrap { border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; background:#0b0b0c; box-shadow: var(--shadow-card); }
  .preview-frame-wrap iframe { width:100%; height:640px; border:0; display:block; background:#101010; }
  .color-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .color-field { display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border-soft); border-radius:999px; padding:6px 12px 6px 6px; }
  .color-field input[type=color] { width:28px; height:28px; padding:0; border:none; border-radius:50%; overflow:hidden; cursor:pointer; background:none; }
  .color-field span { font-size:12px; color:var(--muted); font-weight:500; }

  .card {
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:22px 24px; margin-bottom:18px; box-shadow: var(--shadow-card);
    backdrop-filter: blur(6px); transition: border-color .2s var(--ease), transform .2s var(--ease);
    animation: cardin .4s var(--ease) backwards;
  }
  .card:hover { border-color: rgba(255,255,255,.15); }
  @keyframes cardin { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  .card h2 {
    margin-top:0; margin-bottom:16px; font-size:12.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1px; font-weight:700; display:flex; align-items:center; gap:8px;
  }

  .card.danger-zone { border-color: rgba(240,85,92,.3); background: rgba(240,85,92,.04); }
  .card.danger-zone:hover { border-color: rgba(240,85,92,.45); }
  .card.danger-zone h2 { color: var(--red); }

  /* Carte "interrupteur" (activer/désactiver un module de notification) */
  .card.toggle-card { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .card.toggle-card .toggle-copy h2 { margin-bottom:4px; }
  .card.toggle-card .toggle-copy p { margin:0; }
  .card.toggle-card.disabled { border-color: rgba(240,85,92,.22); }
  .switch { position:relative; display:inline-flex; align-items:center; cursor:pointer; flex-shrink:0; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .switch-track {
    width:46px; height:26px; background: rgba(255,255,255,.14); border:1px solid var(--border);
    border-radius:999px; display:block; position:relative; transition: background-color .18s var(--ease), border-color .18s var(--ease);
  }
  .switch-thumb {
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .18s var(--ease);
  }
  .switch input:checked + .switch-track { background: linear-gradient(135deg, var(--blue), var(--blue2)); border-color: transparent; }
  .switch input:checked + .switch-track .switch-thumb { transform: translateX(20px); }
  .switch input:focus-visible + .switch-track { box-shadow: 0 0 0 3px rgba(46,194,255,.3); }
  .switch-label { font-size:12.5px; font-weight:700; margin-left:10px; color:var(--muted); min-width:64px; }
  .switch input:checked ~ .switch-label { color: var(--green); }

  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap:12px; }
  .stat {
    background: var(--panel2); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:14px 16px; transition: background-color .2s var(--ease), transform .2s var(--ease);
  }
  .stat:hover { background: rgba(255,255,255,.05); transform: translateY(-1px); }
  .stat .label { color:var(--muted-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .stat .value { font-size:19px; font-weight:700; margin-top:6px; letter-spacing:-.2px; }

  .pill {
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
  .pill.ok { background:rgba(62,207,110,.13); color:var(--green); box-shadow: inset 0 0 0 1px rgba(62,207,110,.2); }
  .pill.bad { background:rgba(240,85,92,.13); color:var(--red); box-shadow: inset 0 0 0 1px rgba(240,85,92,.2); }

  label { display:block; font-size:12.5px; color:var(--muted); margin: 16px 0 7px; font-weight:600; }
  input[type=text], input[type=password], input[type=number], input[type=time], select, textarea {
    width:100%; background: rgba(0,0,0,.32); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius: var(--radius-sm); font-size:13.5px; font-family: inherit;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
  }
  input::placeholder, textarea::placeholder { color: var(--muted-dim); opacity: 1; }
  input:hover, select:hover, textarea:hover { border-color: rgba(255,255,255,.3); }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color: var(--blue); background: rgba(46,194,255,.08);
    box-shadow: 0 0 0 3px rgba(46,194,255,.22);
  }
  textarea { font-family: "SF Mono", Consolas, "Cascadia Code", monospace; font-size:12.5px; line-height:1.55; }

  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .checkboxes { display:flex; gap:8px; flex-wrap:wrap; }
  .checkboxes label {
    display:flex; align-items:center; gap:7px; background: var(--panel2); border:1px solid var(--border-soft);
    padding:8px 13px; border-radius:999px; margin:0; color:var(--text); font-size:12.5px; font-weight:500;
    cursor:pointer; transition: background-color .18s var(--ease), border-color .18s var(--ease);
  }
  .checkboxes label:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); }
  .checkboxes input { width:auto; accent-color: var(--blue); }

  .tag-input {
    position: relative; display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    background: rgba(0,0,0,.22); border:1px solid var(--border); border-radius: var(--radius-sm);
    padding:7px 9px; min-height:42px; cursor:text;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
  }
  .tag-input:hover { border-color: rgba(255,255,255,.22); }
  .tag-input:focus-within { border-color: var(--blue); background: rgba(18,179,240,.06); box-shadow: 0 0 0 3px rgba(18,179,240,.16); }
  .tag-input-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .tag-chip {
    display:inline-flex; align-items:center; gap:6px; background: linear-gradient(135deg, var(--blue2), var(--purple2));
    color:#fff; padding:4px 4px 4px 11px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .tag-chip button {
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; background: rgba(255,255,255,.22); font-size:10px; line-height:1;
    transition: background-color .15s var(--ease);
  }
  .tag-chip button:hover { background: rgba(255,255,255,.4); }
  .tag-input-text {
    flex:1; min-width:140px; background:none !important; border:none !important; padding:4px 2px !important;
    box-shadow:none !important; color:var(--text); font-size:13.5px;
  }
  .tag-input-text:focus { outline:none; box-shadow:none !important; background:none !important; }
  .tag-input-suggestions {
    position:absolute; top:calc(100% + 6px); left:0; right:0; background: var(--panel-solid); border:1px solid var(--border);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-pop); max-height:220px; overflow:auto; z-index:30;
    display:none; animation: alertin .15s var(--ease);
  }
  .tag-input-suggestions.open { display:block; }
  .tag-input-suggestion { padding:9px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .tag-input-suggestion:hover, .tag-input-suggestion.active { background: rgba(255,255,255,.08); }
  .tag-input.tag-input-invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(240,85,92,.16); animation: taginshake .3s var(--ease); }
  @keyframes taginshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tag-input-error-msg { display:none; color:var(--red); font-size:11.5px; margin-top:2px; flex-basis:100%; }
  .tag-input-error-msg.show { display:block; }
  .tag-chip.invalid { background: linear-gradient(135deg, #f0656c, #cf3b42); }

  button, .btn {
    background: linear-gradient(135deg, var(--blue), var(--blue2)); color:#fff; border:none;
    padding:10px 20px; border-radius: 999px; font-size:13px; font-weight:600; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    box-shadow: 0 6px 16px -6px rgba(18,179,240,.55);
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), filter .16s var(--ease);
  }
  button.secondary, .btn.secondary {
    background: rgba(255,255,255,.07); box-shadow:none; border:1px solid var(--border);
  }
  button.danger, .btn.danger { background: linear-gradient(135deg, #f0656c, #cf3b42); box-shadow: 0 6px 16px -6px rgba(240,85,92,.5); }
  button:hover, .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:active, .btn:active { transform: translateY(0) scale(.98); }
  button.secondary:hover, .btn.secondary:hover { background: rgba(255,255,255,.11); }

  .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  .alert {
    padding:11px 15px; border-radius: var(--radius-sm); font-size:13px; margin-bottom:16px;
    animation: alertin .25s var(--ease); font-weight:500;
  }
  @keyframes alertin { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }
  .alert.ok { background:rgba(62,207,110,.1); color:var(--green); border:1px solid rgba(62,207,110,.28); }
  .alert.err { background:rgba(240,85,92,.1); color:var(--red); border:1px solid rgba(240,85,92,.28); }

  pre.logbox {
    background: rgba(0,0,0,.3); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:16px; font-size:12px; line-height:1.6; overflow:auto; max-height:480px;
    white-space:pre-wrap; word-break:break-all; font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
  }
  pre.logbox::-webkit-scrollbar, main::-webkit-scrollbar { width:9px; height:9px; }
  pre.logbox::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius:99px; }
  pre.logbox::-webkit-scrollbar-track { background: transparent; }

  /* Page Logs : la boîte se comporte comme .logbox (même fond/bordure) mais
     est un <div> (pas un <pre>) pour pouvoir styler chaque ligne
     individuellement (badge de catégorie + couleur de sévérité). */
  .logbox.log-lines {
    background: rgba(0,0,0,.3); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:8px; font-size:12px; line-height:1.6; overflow:auto; max-height:600px;
    font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
  }
  .log-line {
    display:flex; gap:10px; align-items:flex-start; padding:4px 8px; border-radius:6px;
    white-space:pre-wrap; word-break:break-all; border-left:3px solid transparent;
  }
  .log-line:hover { background: rgba(255,255,255,.03); }
  .log-line .log-text { flex:1; color: var(--muted); }
  .log-line .log-badge {
    flex-shrink:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:2px 7px; border-radius:999px; background: rgba(255,255,255,.08); color:var(--muted-dim);
    margin-top:1px;
  }
  .log-line.lvl-error { border-left-color: var(--red); background: rgba(240,85,92,.06); }
  .log-line.lvl-error .log-text { color:#ff9b9e; }
  .log-line.lvl-warning { border-left-color:#e8a13d; background: rgba(232,161,61,.06); }
  .log-line.lvl-warning .log-text { color:#f0c07d; }
  .log-line.lvl-info .log-text { color:var(--text); }
  .log-line.lvl-debug .log-text { color:var(--muted-dim); }
  .log-empty { padding:20px; text-align:center; color:var(--muted-dim); font-size:12.5px; }

  .log-toolbar { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .log-filters { display:flex; gap:6px; flex-wrap:wrap; }
  .log-chip {
    background: rgba(255,255,255,.04); border:1px solid var(--border-soft); color:var(--muted);
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition: all .15s var(--ease);
  }
  .log-chip:hover { color:var(--text); border-color: var(--border); }
  .log-chip.active { background: linear-gradient(135deg, var(--blue2), var(--purple2)); color:#fff; border-color:transparent; }
  .log-chip-count { background: rgba(255,255,255,.12); border-radius:999px; padding:1px 6px; font-size:10.5px; }
  .log-chip.active .log-chip-count { background: rgba(255,255,255,.25); }
  .log-chip.level-chip.lvl-error.active { background: var(--red); }
  .log-chip.level-chip.lvl-warning.active { background:#e8a13d; }
  .log-chip.level-chip.lvl-info.active { background: var(--blue2); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--muted-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  tbody tr { transition: background-color .15s var(--ease); }
  tbody tr:hover { background: rgba(255,255,255,.03); }

  .muted { color:var(--muted); }
  small.hint { color:var(--muted-dim); display:block; margin-top:6px; font-size:11.5px; }

  /* Éditeur visuel "blocs empilables" (glisser-déposer) - liste de blocs
     réordonnables (Drag and Drop API native, pas de librairie externe), avec
     un mini-formulaire de réglages par bloc. */
  .block-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .block-item {
    background: var(--panel2); border:1px solid var(--border-soft); border-radius: var(--radius-md);
    padding:14px 16px; transition: border-color .18s var(--ease), opacity .18s var(--ease), transform .18s var(--ease);
  }
  .block-item.dragging { opacity:.4; }
  .block-item.drag-over { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(46,194,255,.25); }
  .block-item-head { display:flex; align-items:center; gap:10px; }
  .block-item-handle { cursor:grab; color:var(--muted-dim); font-size:15px; line-height:1; user-select:none; padding:2px 2px; }
  .block-item-handle:active { cursor:grabbing; }
  .block-item-title { flex:1; font-size:13px; font-weight:600; color:var(--text); }
  .block-item-remove {
    all:unset; cursor:pointer; color:var(--muted-dim); font-size:12px; padding:4px 8px; border-radius:999px;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  .block-item-remove:hover { background: rgba(240,85,92,.14); color:var(--red); }
  .block-item-fields { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:10px; margin-top:12px; }
  .block-item-fields label { margin:0 0 5px; font-size:11.5px; }
  .block-item-fields .full { grid-column: 1 / -1; }
  .block-item-fields .checkline { display:flex; align-items:center; gap:7px; margin-top:8px; }
  .block-item-fields .checkline input { width:auto; accent-color: var(--blue); }
  .block-item-fields .checkline label { margin:0; font-size:12.5px; color:var(--text); font-weight:500; cursor:pointer; }
  .block-add-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .block-add-row button { font-size:12px; padding:8px 14px; }
  .block-empty { color:var(--muted-dim); font-size:12.5px; text-align:center; padding:18px 0; border:1px dashed var(--border-soft); border-radius: var(--radius-md); }

  /* Alerte "modifications non enregistrées" - barre fixée en bas de l'écran
     + léger tremblement de la page (façon "wizz" MSN Messenger) si on
     essaie de changer de page sans avoir sauvegardé. */
  @keyframes pageshake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }
  body.shake-warn { animation: pageshake .4s cubic-bezier(.36,.07,.19,.97); }
  .unsaved-bar {
    position: fixed; left:0; right:0; bottom:0; z-index:998;
    background: rgba(23,23,26,.96); backdrop-filter: blur(12px);
    border-top:1px solid var(--border); padding:14px 26px;
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
    box-shadow: 0 -12px 30px -12px rgba(0,0,0,.55);
    transform: translateY(100%); transition: transform .25s var(--ease);
  }
  .unsaved-bar.show { transform: translateY(0); }
  .unsaved-bar.pulse { animation: barpulse .4s var(--ease); }
  @keyframes barpulse { 0%, 100% { box-shadow: 0 -12px 30px -12px rgba(0,0,0,.55); } 50% { box-shadow: 0 -12px 30px -6px rgba(240,85,92,.45); } }
  .unsaved-bar .msg { font-size:14px; font-weight:600; }
  .unsaved-bar .unsaved-actions { display:flex; align-items:center; gap:20px; }
  .unsaved-bar .reset-link {
    all:unset; cursor:pointer; color:var(--blue); font-weight:600; font-size:13px;
    transition: color .15s var(--ease);
  }
  .unsaved-bar .reset-link:hover { color:#fff; }
  .unsaved-bar button.save { padding:9px 20px; }
  @media (max-width: 620px) { .unsaved-bar { padding:12px 16px; } .unsaved-bar .msg { font-size:13px; } }

  /* Boîte de confirmation personnalisée (remplace window.confirm(), qui
     affiche une boîte du navigateur au look générique et pas centrée sur
     la page - ici centrée, dans le thème de l'admin, fermable par Échap
     ou clic en dehors. */
  .modal-overlay {
    position: fixed; inset:0; background: rgba(4,4,6,.62); backdrop-filter: blur(5px);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .2s var(--ease);
  }
  .modal-overlay.show { opacity:1; pointer-events:auto; }
  .modal-box {
    background: var(--panel-solid); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:26px 28px; max-width:440px; width:100%; box-shadow: var(--shadow-pop);
    transform: translateY(10px) scale(.97); transition: transform .22s var(--ease);
  }
  .modal-overlay.show .modal-box { transform:none; }
  .modal-box h3 { margin:0 0 10px; font-size:16.5px; font-weight:700; }
  .modal-box p { margin:0 0 22px; font-size:13.5px; line-height:1.55; color:var(--muted); }
  .modal-box .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:0; }

  .toast-container {
    position: fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column;
    gap:10px; pointer-events:none; max-width: 340px;
  }
  .toast {
    pointer-events:auto; padding:12px 16px; border-radius: var(--radius-md); font-size:13px; font-weight:500;
    box-shadow: var(--shadow-pop); backdrop-filter: blur(8px);
    animation: toastin .3s var(--ease);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .toast.ok { background: rgba(23,45,32,.92); color:var(--green); border:1px solid rgba(62,207,110,.35); }
  .toast.err { background: rgba(48,20,21,.92); color:var(--red); border:1px solid rgba(240,85,92,.35); }
  .toast.out { opacity:0; transform: translateX(12px); }
  @keyframes toastin { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform:none; } }
  .flash-toast { display:none; }
</style>
</head>
<body>

  <div class="modal-box">

<script>
function showToast(message, ok) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (ok ? 'ok' : 'err');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 320);
  }, 3200);
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.flash-toast').forEach(el => {
    showToast(el.textContent.trim(), el.classList.contains('ok'));
  });
});

// Boîte de confirmation personnalisée (remplace window.confirm()) - promesse
// résolue à true/false. Fermable par Échap, clic en dehors, ou Cancel.
// Usage : showConfirm({ title, message, confirmText, danger }).then(ok => ...)
function showConfirm({ title, message, confirmText = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modal-overlay');
    const titleEl = document.getElementById('modal-title');
    const msgEl = document.getElementById('modal-message');
    const okBtn = document.getElementById('modal-confirm');
    const cancelBtn = document.getElementById('modal-cancel');

    titleEl.textContent = title;
    msgEl.textContent = message;
    okBtn.textContent = confirmText;
    okBtn.className = danger ? 'danger' : '';
    overlay.classList.add('show');
    okBtn.focus();

    function cleanup(result) {
      overlay.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('mousedown', onOverlay);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlay(e) { if (e.target === overlay) cleanup(false); }
    function onKey(e) { if (e.key === 'Escape') cleanup(false); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('mousedown', onOverlay);
    document.addEventListener('keydown', onKey);
  });
}

// Champ "tags" réutilisable : espace/entrée/virgule/point-virgule
// transforment le texte tapé en tag (avec une croix pour le retirer), et
// une liste de suggestions s'affiche (toutes si le champ est vide, filtrées
// sinon). `hiddenInput.value` reste une liste séparée par des virgules,
// donc le formulaire qui le contient n'a rien à changer côté serveur.
function createTagInput({ root, hiddenInput, suggestions = [], placeholder = 'Type to add...', validate = null, invalidMessage = 'Invalid value' }) {
  const chipsEl = document.createElement('div');
  chipsEl.className = 'tag-input-chips';
  const textEl = document.createElement('input');
  textEl.type = 'text';
  textEl.className = 'tag-input-text';
  textEl.autocomplete = 'off';
  textEl.spellcheck = false;
  textEl.placeholder = placeholder;
  const suggEl = document.createElement('div');
  suggEl.className = 'tag-input-suggestions';
  const errorEl = document.createElement('div');
  errorEl.className = 'tag-input-error-msg';
  errorEl.textContent = invalidMessage;

  root.innerHTML = '';
  root.appendChild(chipsEl);
  root.appendChild(textEl);
  root.appendChild(suggEl);
  root.appendChild(errorEl);

  let tags = (hiddenInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
  let errTimer = null;

  function showError() {
    root.classList.add('tag-input-invalid');
    errorEl.classList.add('show');
    clearTimeout(errTimer);
    errTimer = setTimeout(clearError, 2500);
  }

  function clearError() {
    root.classList.remove('tag-input-invalid');
    errorEl.classList.remove('show');
  }

  function sync() {
    hiddenInput.value = tags.join(',');
    hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    renderChips();
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    tags.forEach((tag, i) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip' + (validate && !validate(tag) ? ' invalid' : '');
      const label = document.createElement('span');
      label.textContent = tag;
      if (validate && !validate(tag)) { label.title = invalidMessage; }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Remove ' + tag);
      btn.textContent = '✕';
      btn.addEventListener('click', (e) => { e.stopPropagation(); tags.splice(i, 1); sync(); });
      chip.appendChild(label);
      chip.appendChild(btn);
      chipsEl.appendChild(chip);
    });
  }

  function addTag(raw) {
    const value = raw.trim();
    if (!value) { textEl.value = ''; renderSuggestions(); return; }
    if (validate && !validate(value)) {
      // Garde le texte tapé dans le champ pour que l'utilisateur puisse le
      // corriger, au lieu de le faire disparaître silencieusement.
      showError();
      return;
    }
    clearError();
    textEl.value = '';
    if (!tags.some(t => t.toLowerCase() === value.toLowerCase())) {
      tags.push(value);
      sync();
    }
    renderSuggestions();
  }

  function renderSuggestions() {
    const query = textEl.value.trim().toLowerCase();
    const available = suggestions.filter(s => !tags.some(t => t.toLowerCase() === s.toLowerCase()));
    const matches = query ? available.filter(s => s.toLowerCase().includes(query)) : available;
    suggEl.innerHTML = '';
    if (!matches.length) { suggEl.classList.remove('open'); return; }
    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'tag-input-suggestion';
      item.textContent = s;
      // mousedown (pas click) : se déclenche avant le blur du champ texte.
      item.addEventListener('mousedown', (e) => { e.preventDefault(); addTag(s); textEl.focus(); });
      suggEl.appendChild(item);
    });
    suggEl.classList.add('open');
  }

  textEl.addEventListener('input', () => { clearError(); renderSuggestions(); });
  textEl.addEventListener('focus', renderSuggestions);
  textEl.addEventListener('blur', () => setTimeout(() => suggEl.classList.remove('open'), 150));
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',' || e.key === ';' || e.key === ' ') {
      e.preventDefault();
      addTag(textEl.value);
    } else if (e.key === 'Backspace' && !textEl.value && tags.length) {
      tags.pop();
      sync();
    } else if (e.key === 'Escape') {
      suggEl.classList.remove('open');
    }
  });
  root.addEventListener('mousedown', (e) => {
    if (e.target === root || e.target === chipsEl) { textEl.focus(); }
  });

  renderChips();
  return { getTags: () => tags.slice() };
}

// Éditeur visuel "blocs empilables" (glisser-déposer) : liste de blocs
// réordonnables au clic-glisser (Drag and Drop API native du navigateur,
// pas de librairie externe, dans le même esprit que createTagInput
// ci-dessus). Le JSON des blocs est synchronisé dans hiddenInput à chaque
// changement, prêt à être posté avec le formulaire.
const BLOCK_TYPE_DEFS = {
  content_card: {
    label: 'Content card (poster + info)',
    fields: [
      { key: 'show_synopsis', type: 'checkbox', label: 'Show synopsis' },
      { key: 'show_genres', type: 'checkbox', label: 'Show genres' },
      { key: 'show_rating', type: 'checkbox', label: 'Show rating' },
      { key: 'show_duration', type: 'checkbox', label: 'Show duration' },
      { key: 'button_text', type: 'text', label: 'Button text' },
    ],
  },
  text_title: {
    label: 'Text + heading',
    fields: [
      { key: 'heading', type: 'text', label: 'Heading' },
      { key: 'body', type: 'textarea', label: 'Body text', full: true },
      { key: 'align', type: 'select', label: 'Alignment', options: ['left', 'center', 'right'] },
    ],
  },
  button: {
    label: 'Standalone button',
    fields: [
      { key: 'text', type: 'text', label: 'Button text' },
      { key: 'url', type: 'text', label: 'Link URL' },
      { key: 'align', type: 'select', label: 'Alignment', options: ['left', 'center', 'right'] },
    ],
  },
  spacer: {
    label: 'Divider / spacer',
    fields: [
      { key: 'height', type: 'number', label: 'Height (px)' },
      { key: 'show_line', type: 'checkbox', label: 'Show divider line' },
    ],
  },
  text_date: {
    label: 'Text + date',
    fields: [
      { key: 'text', type: 'textarea', label: 'Text', full: true },
      { key: 'use_send_date', type: 'checkbox', label: 'Use the send date automatically' },
      { key: 'date', type: 'text', label: 'Custom date (if not automatic)' },
      { key: 'align', type: 'select', label: 'Alignment', options: ['left', 'center', 'right'] },
    ],
  },
};

const BLOCK_DEFAULT_PROPS = {
  content_card: { show_synopsis: true, show_genres: true, show_rating: true, show_duration: true, button_text: 'Watch' },
  text_title: { heading: '', body: '', align: 'left' },
  button: { text: 'Open Jellyfin', url: '', align: 'left' },
  spacer: { height: 16, show_line: false },
  text_date: { text: '', date: '', use_send_date: true, align: 'left' },
};

function createBlockBuilder({ root, hiddenInput, initialBlocks = [], onChange = null }) {
  const newId = () => Math.random().toString(36).slice(2, 10);
  let blocks = (initialBlocks || [])
    .filter(b => BLOCK_TYPE_DEFS[b.type])
    .map(b => ({ id: b.id || newId(), type: b.type, props: { ...BLOCK_DEFAULT_PROPS[b.type], ...(b.props || {}) } }));
  let dragIndex = null;

  const listEl = document.createElement('div');
  listEl.className = 'block-list';
  const addRow = document.createElement('div');
  addRow.className = 'block-add-row';
  Object.keys(BLOCK_TYPE_DEFS).forEach(type => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'secondary';
    btn.textContent = '+ ' + BLOCK_TYPE_DEFS[type].label;
    btn.addEventListener('click', () => { blocks.push({ id: newId(), type, props: { ...BLOCK_DEFAULT_PROPS[type] } }); sync(); });
    addRow.appendChild(btn);
  });

  root.innerHTML = '';
  root.appendChild(listEl);
  root.appendChild(addRow);

  function sync() {
    // Ré-affiche toute la liste - nécessaire quand la structure change
    // (ajout/suppression/réordonnancement d'un bloc, ou une case à cocher
    // qui affiche/masque un autre champ, ex: la date personnalisée).
    hiddenInput.value = JSON.stringify(blocks);
    hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    render();
    if (onChange) onChange();
  }

  function syncData() {
    // Met juste à jour le JSON + l'aperçu, SANS reconstruire le DOM - sinon
    // un champ texte/textarea perdrait le focus (et le curseur repartirait
    // au début) à chaque lettre tapée, ce qui rendait la saisie saccadée.
    hiddenInput.value = JSON.stringify(blocks);
    hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    if (onChange) onChange();
  }

  function fieldInput(block, field) {
    const value = block.props[field.key];
    let el;
    if (field.type === 'checkbox') {
      el = document.createElement('input');
      el.type = 'checkbox';
      el.checked = !!value;
      el.addEventListener('change', () => { block.props[field.key] = el.checked; sync(); });
    } else if (field.type === 'select') {
      el = document.createElement('select');
      (field.options || []).forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
        if (opt === value) o.selected = true;
        el.appendChild(o);
      });
      el.addEventListener('change', () => { block.props[field.key] = el.value; sync(); });
    } else if (field.type === 'textarea') {
      el = document.createElement('textarea');
      el.rows = 3;
      el.value = value || '';
      el.addEventListener('input', () => { block.props[field.key] = el.value; syncData(); });
    } else if (field.type === 'number') {
      el = document.createElement('input');
      el.type = 'number';
      el.value = value != null ? value : '';
      el.addEventListener('input', () => { block.props[field.key] = el.value === '' ? '' : Number(el.value); syncData(); });
    } else {
      el = document.createElement('input');
      el.type = 'text';
      el.value = value || '';
      el.addEventListener('input', () => { block.props[field.key] = el.value; syncData(); });
    }
    return el;
  }

  function render() {
    listEl.innerHTML = '';
    if (!blocks.length) {
      const empty = document.createElement('div');
      empty.className = 'block-empty';
      empty.textContent = 'No blocks yet — add one below.';
      listEl.appendChild(empty);
      return;
    }
    blocks.forEach((block, index) => {
      const def = BLOCK_TYPE_DEFS[block.type];
      if (!def) return;
      const item = document.createElement('div');
      item.className = 'block-item';
      item.draggable = true;
      item.dataset.index = index;

      const head = document.createElement('div');
      head.className = 'block-item-head';
      const handle = document.createElement('span');
      handle.className = 'block-item-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder';
      const titleEl = document.createElement('span');
      titleEl.className = 'block-item-title';
      titleEl.textContent = def.label;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'block-item-remove';
      removeBtn.textContent = '✕ Remove';
      removeBtn.addEventListener('click', () => { blocks.splice(index, 1); sync(); });
      head.appendChild(handle);
      head.appendChild(titleEl);
      head.appendChild(removeBtn);
      item.appendChild(head);

      const visibleFields = def.fields.filter(f => !(f.key === 'date' && block.props.use_send_date));
      if (visibleFields.length) {
        const fieldsWrap = document.createElement('div');
        fieldsWrap.className = 'block-item-fields';
        visibleFields.forEach(field => {
          if (field.type === 'checkbox') {
            const wrap = document.createElement('div');
            wrap.className = 'checkline' + (field.full ? ' full' : '');
            const inputEl = fieldInput(block, field);
            inputEl.id = 'blk_' + block.id + '_' + field.key;
            const lbl = document.createElement('label');
            lbl.textContent = field.label;
            lbl.setAttribute('for', inputEl.id);
            wrap.appendChild(inputEl);
            wrap.appendChild(lbl);
            fieldsWrap.appendChild(wrap);
          } else {
            const wrap = document.createElement('div');
            if (field.full) wrap.className = 'full';
            const lbl = document.createElement('label');
            lbl.textContent = field.label;
            wrap.appendChild(lbl);
            wrap.appendChild(fieldInput(block, field));
            fieldsWrap.appendChild(wrap);
          }
        });
        item.appendChild(fieldsWrap);
      }

      item.addEventListener('dragstart', (e) => {
        dragIndex = index;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        listEl.querySelectorAll('.block-item').forEach(el => el.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e) => { e.preventDefault(); item.classList.add('drag-over'); });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        if (dragIndex === null || dragIndex === index) return;
        const [moved] = blocks.splice(dragIndex, 1);
        blocks.splice(index, 0, moved);
        dragIndex = null;
        sync();
      });

      listEl.appendChild(item);
    });
  }

  hiddenInput.value = JSON.stringify(blocks);
  render();
  return { getBlocks: () => blocks.map(b => ({ ...b, props: { ...b.props } })) };
}

// Garde-fou "modifications non enregistrées" - surveille tous les
// <form data-track-dirty="true"> de la page (les formulaires qui
// s'auto-soumettent au changement, comme les interrupteurs, n'ont pas cet
// attribut et ne sont donc jamais concernés). Dès qu'un champ change :
// - la barre "Careful — you have unsaved changes!" apparaît en bas,
// - tenter de quitter la page (clic sur un lien du header/nav, fermeture de
//   l'onglet, rechargement) secoue légèrement la page (façon "wizz" MSN) et
//   bloque le premier clic - un second clic sur le même lien dans les
//   quelques secondes qui suivent laisse passer la navigation.
function initUnsavedGuard() {
  const trackedForms = Array.from(document.querySelectorAll('form[data-track-dirty="true"]'));
  if (!trackedForms.length) return;

  const bar = document.getElementById('unsaved-bar');
  const resetBtn = document.getElementById('unsaved-reset');
  const saveBtn = document.getElementById('unsaved-save');
  let dirtyForm = null;
  let leaveOverride = null; // { href, expiresAt }

  function serialize(form) {
    return Array.from(form.elements)
      .filter(el => el.name && !el.disabled)
      .map(el => {
        if (el.type === 'checkbox' || el.type === 'radio') return el.name + '=' + el.checked;
        return el.name + '=' + el.value;
      })
      .join('&');
  }

  const baselines = new WeakMap();
  trackedForms.forEach(form => baselines.set(form, serialize(form)));

  function setDirty(form) {
    dirtyForm = form;
    bar.classList.add('show');
  }

  function clearDirty() {
    dirtyForm = null;
    bar.classList.remove('show');
  }

  function checkForm(form) {
    if (serialize(form) !== baselines.get(form)) {
      setDirty(form);
    } else if (dirtyForm === form) {
      // Revenu à l'état initial (ex: undo manuel) -> plus besoin d'avertir,
      // mais seulement si aucun AUTRE formulaire suivi n'est, lui, modifié.
      const stillDirty = trackedForms.find(f => f !== form && serialize(f) !== baselines.get(f));
      if (stillDirty) { setDirty(stillDirty); } else { clearDirty(); }
    }
  }

  trackedForms.forEach(form => {
    form.addEventListener('input', () => checkForm(form));
    form.addEventListener('change', () => checkForm(form));
    // Un vrai envoi (clic sur LE bouton "Save changes" du formulaire lui-même,
    // pas celui de la barre "unsaved") est justement en train d'enregistrer -
    // il faut éteindre la garde AVANT que la page ne navigue, sinon
    // "beforeunload" se déclenche quand même et affiche la boîte de dialogue
    // native "Quitter le site Web ?" malgré l'enregistrement en cours (même
    // classe de bug que le clic sur un lien de nav, corrigée juste en dessous).
    form.addEventListener('submit', () => clearDirty());
  });

  resetBtn.addEventListener('click', () => {
    if (!dirtyForm) return;
    dirtyForm.reset();
    // form.reset() ne déclenche pas toujours 'input'/'change' pour tous les
    // champs (ex: certains navigateurs pour les <select>) - on revérifie
    // explicitement pour être sûr que la barre se referme.
    checkForm(dirtyForm);
    // Les champs pilotés par du JS (tag-input, block builder) ont leur
    // propre état interne qui ne connaît pas form.reset() : plus simple et
    // fiable de recharger la page plutôt que de resynchroniser chaque widget.
    if (dirtyForm.querySelector('.tag-input, #block-builder-root')) {
      window.location.reload();
    }
  });

  saveBtn.addEventListener('click', () => {
    if (dirtyForm) { dirtyForm.requestSubmit(); }
  });

  window.addEventListener('beforeunload', (e) => {
    if (!dirtyForm) return;
    e.preventDefault();
    e.returnValue = '';
  });

  document.querySelectorAll('header a, nav a').forEach(link => {
    link.addEventListener('click', (e) => {
      if (!dirtyForm) return;
      const href = link.href;
      const now = Date.now();
      if (leaveOverride && leaveOverride.href === href && now < leaveOverride.expiresAt) {
        // Deuxième clic sur le même lien : on laisse partir - et on éteint
        // la garde AVANT que la navigation ne parte, sinon "beforeunload"
        // se déclenche quand même juste après et affiche EN PLUS la boîte
        // de dialogue native du navigateur ("Quitter le site Web ?"), ce
        // qui donnait l'impression que l'avertissement du nav "revenait"
        // malgré le clic de confirmation.
        clearDirty();
        return;
      }
      e.preventDefault();
      leaveOverride = { href, expiresAt: now + 4000 };
      document.body.classList.remove('shake-warn');
      // Force le reflow pour pouvoir rejouer l'animation si elle est déjà en cours.
      void document.body.offsetWidth;
      document.body.classList.add('shake-warn');
      bar.classList.add('pulse');
      setTimeout(() => bar.classList.remove('pulse'), 420);
    });
  });
}
document.addEventListener('DOMContentLoaded', initUnsavedGuard);
</script>
</body>
</html>
