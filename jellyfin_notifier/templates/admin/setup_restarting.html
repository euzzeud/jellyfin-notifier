<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restarting - Jellyfin Notifier</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0c0c0d; color:#e8e8ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .box { text-align:center; max-width:360px; padding:32px; }
  .spinner {
    width:32px; height:32px; margin:0 auto 18px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15); border-top-color:#2ec2ff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size:16px; margin:0 0 8px; }
  p { font-size:13px; color:#9a9aa0; margin:0; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Saved — restarting to apply the new configuration…</h1>
  <p>This page will reload automatically in a few seconds.</p>
</div>
<script>
  function tryReload() {
    fetch('/', { method: 'GET', cache: 'no-store' })
      .then(() => { window.location.href = '/'; })
      .catch(() => { setTimeout(tryReload, 1000); });
  }
  setTimeout(tryReload, 2000);
</script>
</body>
</html>
